<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Reproductor de Música</title>
  <style>
    /* Estilos síncronos críticos en <head> para evitar FOUC y destellos blancos en t=0ms */
    :root, html, body, #root {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #0f0f13;
      color: #e8e8f0;
      overflow: hidden;
    }
    html[data-theme='light'],
    html[data-theme='light'] body,
    html[data-theme='light'] #root {
      background-color: #f3f4f8;
      color: #20212b;
    }
  </style>
  <script>
    (function () {
      try {
        var root = document.documentElement;
        var savedTheme = window.localStorage.getItem('musicPlayerTheme');
        var isLight = savedTheme === 'light';
        root.dataset.theme = isLight ? 'light' : 'dark';
        root.style.backgroundColor = isLight ? '#f3f4f8' : '#0f0f13';
      } catch (_) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
