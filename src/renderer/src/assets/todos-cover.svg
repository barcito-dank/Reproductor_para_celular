<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130f2c" />
      <stop offset="50%" stop-color="#1d1442" />
      <stop offset="100%" stop-color="#0d0b1a" />
    </linearGradient>

    <radialGradient id="glowViolet" cx="25%" cy="22%" r="65%">
      <stop offset="0%" stop-color="#7c5cfc" stop-opacity="0.55" />
      <stop offset="60%" stop-color="#7c5cfc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#7c5cfc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPink" cx="80%" cy="78%" r="60%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.48" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCyan" cx="78%" cy="20%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="cardBack1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.16" />
    </linearGradient>

    <linearGradient id="cardBack2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="discBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#262246" />
      <stop offset="45%" stop-color="#151329" />
      <stop offset="100%" stop-color="#231c3d" />
    </linearGradient>

    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="48%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="centerBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cfc" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Fondo principal -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  <rect width="512" height="512" fill="url(#glowViolet)" />
  <rect width="512" height="512" fill="url(#glowPink)" />
  <rect width="512" height="512" fill="url(#glowCyan)" />

  <!-- Tarjetas de colección apiladas (símbolo de todos los álbumes reunidos) -->
  <rect
    x="118"
    y="74"
    width="276"
    height="276"
    rx="44"
    transform="rotate(-11 256 212)"
    fill="url(#cardBack1)"
    stroke="#22d3ee"
    stroke-opacity="0.35"
    stroke-width="2.5"
  />
  <rect
    x="118"
    y="86"
    width="276"
    height="276"
    rx="44"
    transform="rotate(9 256 224)"
    fill="url(#cardBack2)"
    stroke="#ec4899"
    stroke-opacity="0.38"
    stroke-width="2.5"
  />

  <!-- Disco maestro central -->
  <circle
    cx="256"
    cy="256"
    r="164"
    fill="url(#discBody)"
    stroke="url(#neonRing)"
    stroke-width="6"
  />

  <!-- Surcos concéntricos iridiscentes -->
  <circle cx="256" cy="256" r="142" fill="none" stroke="#8b5cf6" stroke-opacity="0.28" stroke-width="2" />
  <circle cx="256" cy="256" r="122" fill="none" stroke="#22d3ee" stroke-opacity="0.24" stroke-width="2" stroke-dasharray="90 36" />
  <circle cx="256" cy="256" r="102" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="110 42" />

  <!-- Sello central vibrante -->
  <circle cx="256" cy="256" r="76" fill="url(#centerBadge)" />
  <circle cx="256" cy="256" r="76" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Corchea doble luminosa en el centro -->
  <g fill="#ffffff">
    <path d="M236 216v58.5c-4.2-2.6-9.5-3.8-15-2.8-11.2 2-18.8 11.4-17 20.8 1.8 9.4 12.2 15.4 23.4 13.4 9.9-1.8 17.2-9.5 17.6-18V235l48-11v40.5c-4.2-2.6-9.5-3.8-15-2.8-11.2 2-18.8 11.4-17 20.8 1.8 9.4 12.2 15.4 23.4 13.4 9.9-1.8 17.2-9.5 17.6-18V203l-66 13z" />
  </g>

  <!-- Barras inferiores de espectro sutiles -->
  <g opacity="0.85">
    <rect x="176" y="454" width="12" height="18" rx="6" fill="#6366f1" />
    <rect x="198" y="444" width="12" height="28" rx="6" fill="#8b5cf6" />
    <rect x="220" y="434" width="12" height="38" rx="6" fill="#a855f7" />
    <rect x="242" y="442" width="12" height="30" rx="6" fill="#d946ef" />
    <rect x="264" y="430" width="12" height="42" rx="6" fill="#ec4899" />
    <rect x="286" y="440" width="12" height="32" rx="6" fill="#38bdf8" />
    <rect x="308" y="450" width="12" height="22" rx="6" fill="#22d3ee" />
    <rect x="330" y="456" width="12" height="16" rx="6" fill="#6366f1" />
  </g>
</svg>
